<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunter | Trading Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'space-grotesk': ['"Space Grotesk"', 'sans-serif'],
              'inter': ['"Inter"', 'sans-serif'],
              'mono': ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              background: '#0A0A0C',
              foreground: '#E8E8E8',
              primary: '#FFFFFF',
              secondary: '#A1A1AA',
              'hunter-text-dim': '#6B6B6B',
              'hunter-border': '#3A3A3A',
              border: '#1E1E22',
              muted: {
                DEFAULT: '#1E1E22',
                foreground: '#6B6B6B'
              }
            },
            animation: {
              'scroll-left': 'scroll-left 60s linear infinite',
            },
            keyframes: {
              'scroll-left': {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-primary: #0A0A0C;
        --text-primary: #E8E8E8;
        --accent-cyan: #FFFFFF;
      }
      
      html {
        scroll-behavior: smooth;
        background-color: #0A0A0C;
      }
      
      body {
        margin: 0;
        background-color: #0A0A0C;
        color: #E8E8E8;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      ::selection {
        background-color: rgba(255, 255, 255, 0.15);
        color: #FFFFFF;
      }

      .font-space-grotesk { font-family: 'Space Grotesk', sans-serif; }
      .font-inter { font-family: 'Inter', sans-serif; }
      
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script type="importmap">
{
  "imports": {

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.553.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lightweight-charts": "https://esm.sh/lightweight-charts@4.1.1"
  }
}
</script>
